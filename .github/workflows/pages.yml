name: Publish Example To Pages

# Builds the package from this repository, documents the example workflow
# with it, and publishes the website and booklet to the gh-pages branch.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache Racket and sciencelogo
        uses: actions/cache@v6
        with:
          path: ~/.cache/sciencelogo-documenter
          key: racket-${{ hashFiles('src/sciencelogo_documenter/versions.py') }}

      - name: Build and install the package
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl

      - name: Document the example workflow
        run: sciencelogo-documenter build examples/pendulum/workflow.rkt --out _build

      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sciencelogo-documenter publish --target pages-branch --branch gh-pages --site _build/site
