name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache Racket and sciencelogo
        uses: actions/cache@v6
        with:
          path: ~/.cache/sciencelogo-documenter
          key: racket-${{ hashFiles('src/sciencelogo_documenter/versions.py') }}

      - name: Install the package
        run: python -m pip install -e .

      - name: Run validation
        run: ./scripts/validate-local.sh

      - name: Run release check
        run: |
          export SCIENCELOGO_DOCUMENTER_RACKET="$(python -m sciencelogo_documenter bootstrap)"
          ./scripts/release-check-local.sh
