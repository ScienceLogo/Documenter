[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciencelogo-documenter"
dynamic = ["version"]
description = "Readable websites and PDF booklets from ScienceLogo workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Riccardo Boero" }
]
dependencies = []
keywords = ["sciencelogo", "workflow", "documentation", "static-site", "pdf"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Scientific/Engineering"
]

[project.urls]
Homepage = "https://github.com/ScienceLogo/Documenter"
Repository = "https://github.com/ScienceLogo/Documenter"
Changelog = "https://github.com/ScienceLogo/Documenter/blob/main/CHANGELOG.md"

[project.scripts]
sciencelogo-documenter = "sciencelogo_documenter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "sciencelogo_documenter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sciencelogo_documenter = ["racket/**/*.rkt"]
